name: Release

# Publish a GitHub release (tag like v1.2.3) to build and attach module.json + module.zip.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      # pnpm is declared under devEngines only (no packageManager field), so pass the version explicitly.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      # Stamp the manifest with the release version and the tag-specific download URL.
      # The manifest URL stays on /releases/latest/ so installed copies can find updates.
      - name: Update module.json
        run: |
          VERSION="${TAG#v}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${TAG}/module.zip"
          jq --arg version "$VERSION" --arg download "$DOWNLOAD" \
            '.version = $version | .download = $download' module.json > module.json.tmp
          mv module.json.tmp module.json
          cat module.json

      # module.json must sit at the zip root. dist/ is gitignored, so list files explicitly.
      - name: Package module
        run: zip -r module.zip module.json dist styles lang LICENSE README.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" module.json module.zip --clobber
